name: Autonomous Growth Engine

on:
  schedule:
    # Runs automatically every day at 8:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  run-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Global PSEO Generation
        run: |
          curl -X POST https://micro-utility-engine.onrender.com/api/generate-pseo \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SECRET }}" \
            -d '{
              "keyword": "urgent uscis translation and certification template 2026",
              "slug": "urgent-uscis-translation-template"
            }'

      - name: Trigger Automated Global Lead Ingestion
        run: |
          curl -X POST https://micro-utility-engine.onrender.com/api/ingest-lead \
            -H "Content-Type: application/json" \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SECRET }}" \
            -d '{
              "vertical": "Immigration & Global Compliance",
              "company_name": "Apex Cloud Systems Inc.",
              "location": "San Francisco, CA",
              "contact_email": "executives@apexcloud.io",
              "pain_point": "Managing complex multi-jurisdiction tax nexus and unformatted compliance data pipelines."
            }'

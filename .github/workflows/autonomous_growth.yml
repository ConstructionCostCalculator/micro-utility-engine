name: Validate and Monitor SolveEase
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  daily-health-check:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Check deployment and record scan
        env:
          RENDER_EXTERNAL_URL: ${{ secrets.RENDER_EXTERNAL_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          if [ -z "$RENDER_EXTERNAL_URL" ]; then
            echo "RENDER_EXTERNAL_URL secret is not set; skipping deployment monitor."
            exit 0
          fi
          python scanner.py
